# Select Your Destiny — local full stack
#   cp .env.example .env && docker compose up --build
#   web      http://localhost:3000   (admin at /admin)
#   backend  http://localhost:8080/api
#   postgres localhost:5432
services:
  postgres:
    image: postgres:16-alpine
    container_name: syd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-destiny}
      POSTGRES_USER: ${DB_USER:-destiny}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-destiny}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # executed in alphabetical order on first start only (empty volume)
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-destiny} -d ${DB_NAME:-destiny}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: syd-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: ../infra/backend.Dockerfile
    container_name: syd-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-destiny}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-destiny}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-destiny}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-destiny}
      DB_USERNAME: ${DB_USER:-destiny}
      DB_PASSWORD: ${DB_PASSWORD:-destiny}
      SPRING_DATA_REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      OTP_DEV_MODE: ${OTP_DEV_MODE:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8081}
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-MOCK}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      SMS_PROVIDER_API_KEY: ${SMS_PROVIDER_API_KEY:-}
    ports:
      - "8080:8080"

  web:
    build:
      context: ./web
      dockerfile: ../infra/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
        NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_KEY:-}
    container_name: syd-web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
      NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_KEY:-}
    ports:
      - "3000:3000"

volumes:
  pgdata:
