server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: select-your-destiny
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:select-your-destiny-dev-secret-key-change-me-0123456789}
    expiry-hours: 72
  otp:
    dev-code: "123456"
  seat-lock-minutes: 10
  seed: ${APP_SEED:true}
  admin-password: ${ADMIN_PASSWORD:Admin@123}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

# Toucan Payments (PSP). Secrets come ONLY from environment variables — never commit them.
toucan:
  enabled: ${TOUCAN_ENABLED:false}
  checkout-url: ${TOUCAN_CHECKOUT_URL:https://pay.testtoucanpay.in/api/auth/getpaymentsession}
  status-url: ${TOUCAN_STATUS_URL:https://pay.toucanpay.in/api/pay/v1/checkStatus}
  terminal-id: ${TOUCAN_TERMINAL_ID:}
  merchant-number: ${TOUCAN_MERCHANT_NUMBER:}
  mac: ${TOUCAN_MAC:}
  murl: ${TOUCAN_MURL:https://merchant.testtoucanpay.in/}
  status-token: ${TOUCAN_STATUS_TOKEN:}
  currency: INR

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:destiny;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/destiny}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
